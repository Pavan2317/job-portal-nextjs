<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Portal</title>
    <style>
        body {
            background-color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #111827;
            margin: 0;
            padding: 0;
        }
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .hero-section {
            background-color: #ffffff;
            text-align: center;
            padding: 50px 20px;
        }
        .hero-section h1 {
            font-size: 42px;
            font-weight: bold;
            color: #111827;
            margin-bottom: 10px;
        }
        .hero-section p {
            color: #4b5563;
            font-size: 18px;
            margin-bottom: 30px;
        }
        .search-box {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 800px;
            margin: 0 auto;
        }
        .blue-background {
            background-color: #2563eb;
            color: #ffffff;
            padding: 60px 20px;
            border-radius: 12px;
            text-align: center;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="hero-section">
            <h1>Find your dream job now</h1>
            <p>Explore thousands of job opportunities from top companies.</p>
            <div class="search-box">
                <div>Skills / Designation</div>
                <div>Experience</div>
                <div>Location</div>
                <button style="background-color: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer;">Search Jobs</button>
            </div>
        </div>
        <div class="blue-background">
            <h2>Search jobs anytime, anywhere</h2>
            <p>Download our mobile app and find your dream job on the go.</p>
        </div>
    </div>
</body>
</html>
